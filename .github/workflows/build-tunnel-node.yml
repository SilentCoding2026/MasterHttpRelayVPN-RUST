name: Build Tunnel Node

on:
  workflow_dispatch:  # اجازه اجرای دستی از تب Actions
  push:
    branches: [ main ]
    paths:
      - 'tunnel-node/**'  # فقط با تغییر در پوشه tunnel-node اجرا شود

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build tunnel-node (release)
        working-directory: ./tunnel-node
        run: cargo build --release

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-node-binary
          path: tunnel-node/target/release/tunnel-node
          if-no-files-found: error
